<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11171a">
<meta name="description" content="一滴の菌で皿を守る、七日間の培養ローグライク。">
<title>シャーレ — PETRI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8d3a0' stroke='%23c9d6d8' stroke-width='2'/%3E%3Ccircle cx='12' cy='14' r='6' fill='%23c44e3a'/%3E%3Ccircle cx='20' cy='19' r='5' fill='%233a5ca8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" data-screen="title">
  <header id="top">
    <div class="brand">シャーレ</div>
    <ol id="days" aria-label="培養日数"></ol>
    <div class="top-actions">
      <button id="notesBtn" class="icon-btn" aria-label="観察ノート"></button>
      <button id="menuBtn" class="icon-btn" aria-label="メニュー"></button>
    </div>
  </header>

  <main id="board">
    <section id="dishArea">
      <div id="dishWrap">
        <canvas id="dishGL"></canvas>
        <canvas id="dishFX"></canvas>
        <div id="dayCard" aria-live="polite"></div>
        <div id="stamp"></div>
        <div id="gen" aria-hidden="true"></div>
        <button id="speedBtn" aria-label="早送り"></button>
      </div>
    </section>
    <aside id="notebook" aria-label="観察ノート">
      <div class="sheet-handle"></div>
      <section class="nb-sec"><h3>皿の菌</h3><ul id="nbStrains"></ul></section>
      <section class="nb-sec"><h3>侵入株</h3><div id="nbInvader"></div></section>
      <section class="nb-sec"><h3>今日の皿</h3><ul id="nbEnv"></ul></section>
    </aside>
  </main>

  <section id="console">
    <div id="shareBar">
      <div class="labels">
        <span class="mine"><small>自分</small><b id="shareMine">0%</b></span>
        <span class="theirs"><small>侵入株</small><b id="shareTheirs">0%</b></span>
      </div>
      <div class="track">
        <div id="shareSegs" class="segs"></div>
        <div id="shareInv" class="inv"></div>
        <div id="shareTarget" class="tline"><span></span></div>
      </div>
    </div>
    <div id="handRow">
      <div id="drops" aria-label="残りの滴下"></div>
      <div id="hand"></div>
    </div>
  </section>
</div>

<div id="layer" hidden></div>
<div id="coach" hidden></div>
<noscript><p style="color:#eee;padding:24px">シャーレを遊ぶには JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
