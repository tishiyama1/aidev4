<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roguelike Experiments</title>
<style>
  :root { --bg: #121314; --fg: #ece6d8; --dim: #8d877b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  a { display: flex; flex-direction: column; justify-content: flex-end; width: min(320px, 100%); height: 220px; padding: 22px; border-radius: 10px; color: inherit; text-decoration: none; transition: transform .2s; }
  a:hover { transform: translateY(-4px); }
  a.m { background: radial-gradient(circle at 70% 30%, #4a3d2c, #1c1712 70%); border: 1px solid #5a4a36; }
  a.p { background: radial-gradient(circle at 70% 30%, #39504f, #121a1b 70%); border: 1px solid #3c5554; font-family: 'Hiragino Sans', sans-serif; }
  b { font-size: 40px; letter-spacing: .12em; font-weight: 800; }
  a.p b { font-weight: 300; }
  small { color: var(--dim); letter-spacing: .4em; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <a class="m" href="michiritsu/"><b>未知律</b><small>THE UNWRITTEN LAWS</small></a>
  <a class="p" href="petri/"><b>シャーレ</b><small>PETRI</small></a>
</main>
</body>
</html>
